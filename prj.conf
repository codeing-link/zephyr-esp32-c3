# ESP32-C3-DevKitM 的 GPIO8 LED 闪灯配置。
CONFIG_GPIO=y

# 保持开发板默认 UART0 引脚的串口控制台可用。
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# 日志通过 USB Serial/JTAG（主机侧 /dev/ttyACM0）输出。
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3

# BLE 外设、透传服务和 153 字节 MTU 支持。
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=21
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=153
CONFIG_BT_BUF_ACL_RX_SIZE=156

# UART0 用作外部设备透传接口。
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_REBOOT=y

# 使用内部 Flash 保存名称、广播参数等掉电保持配置。
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
